# Render Blueprint — Graphile Worker (Background Worker).
# Deploy from the closet-dashboard repo. Set Root Directory to the repo root
# (parent of this file) so `npm run worker` resolves dashboard deps + @/* imports.
#
# Dashboard → New → Blueprint → this file, OR create a Background Worker manually
# with the same build/start commands (see docs/ops/GRAPHILE_WORKER.md).

services:
  - type: worker
    name: closet-dashboard-graphile-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      # Keep NODE_ENV=production; tsx/dotenv are in dependencies so npm ci installs them.
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CUSTOM_SITE_CLAUDE_MODEL
        sync: false
