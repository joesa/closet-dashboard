# Production Graphile Worker (Oracle Always Free VM, or any always-on ≥2GB host).
#
#   cd closet-dashboard
#   docker compose -f worker/docker-compose.prod.yml up -d --build
#   docker compose -f worker/docker-compose.prod.yml logs -f
#
# Differs from the repo-root docker-compose.worker.yml, which is a LOCAL DEV file:
# that one bind-mounts the source and runs `npm ci` as its command, so with a
# restart policy it would reinstall the full dependency tree on every container
# start and every VM reboot. This one bakes an image instead.
services:
  graphile-worker:
    build:
      # Repo root — the worker imports out of src/ via the @/* alias.
      context: ..
      dockerfile: worker/Dockerfile
      # Stamped into the image so the running build is visible in
      # public.worker_instances. Substitution reads the SHELL environment —
      # redeploy.sh exports both. Empty is fine; the row then says unknown.
      args:
        GIT_SHA: ${GIT_SHA:-}
        IMAGE_BUILT_AT: ${IMAGE_BUILT_AT:-}
    env_file:
      # Same secrets the Next app uses. See worker/worker.env.example.
      - ../.env.local
    restart: unless-stopped
    # Render rotated logs for you; a bare VM does not. Without this the JSON
    # job events fill the boot volume and the worker dies with ENOSPC.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    # Full redesign holds a multi-minute Claude call plus page HTML in memory.
    # The default is sized to be safe on the SMALLEST host we might land on —
    # a 1 OCPU / 6GB A1 — where the old hardcoded 6g was the entire machine and
    # let the container take the host down instead of being constrained.
    # On a 12GB instance, raise it:
    #   WORKER_MEM_LIMIT=8g docker compose -f worker/docker-compose.prod.yml up -d
    # Substitution reads the shell environment, not .env.local (that file is
    # env_file, which injects into the container — a different mechanism).
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    stop_grace_period: 60s
