name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout websites sibling (shared libs)
        uses: actions/checkout@v4
        with:
          repository: joesa/custom-closets-websites
          ref: main
          path: .ci-siblings/custom-closets-websites
          sparse-checkout: |
            src/lib/customSite.ts
            src/lib/widgetCdn.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # A type error used to reach production because nothing typechecked in
      # CI — the build on Vercel was the first thing to notice.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check:worker-env
      - name: shared lib sync (customSite + widgetCdn)
        run: npm run test:custom-site-sync -- --websites-root .ci-siblings/custom-closets-websites
      # Catches what only appears at build time: bad route exports, server/client
      # boundary violations, and modules that fail to resolve in the bundle.
      - name: production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
