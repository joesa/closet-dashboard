name: Template browser quality

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      urls:
        description: Optional comma-separated engine URLs (otherwise discovered automatically)
        required: false
        type: string
  schedule:
    - cron: '23 8 * * *'

jobs:
  browser-quality:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      QA_URLS: ${{ inputs.urls }}
      QA_DISCOVERY_URL: https://www.ditchtheform.com/api/quality/template-canaries
      QA_LIGHTHOUSE_RUNS: '3'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Discover engine canaries and run axe, median Lighthouse, layout, focus, and motion gates
        run: npm run audit:template-quality
      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-quality-report
          path: audit-output/template-quality.json
          if-no-files-found: warn
